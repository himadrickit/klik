<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>klik</title>
<style>
:root {
	--bg: #d8d3c8;
	--fg: #1d1d1b;
	--dim: #6d6a62;
	--red: #e0392e;
}
:root[data-theme="dark"] {
	--bg: #131313;
	--fg: #e2e0da;
	--dim: #8b8984;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #131313;
		--fg: #e2e0da;
		--dim: #8b8984;
	}
}
* { box-sizing: border-box; }
body {
	margin: 0;
	padding: 2rem 1rem 4rem;
	background: var(--bg);
	color: var(--fg);
	font: 16px/1.5 system-ui, sans-serif;
}
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* the camera */
#cam {
	max-width: 40rem;
	margin: 0 auto;
	padding: 0 1rem 1rem;
	background: #1b1b1b;
	border-radius: 1.1rem;
	box-shadow: 0 .5rem 0 #0b0b0b, 0 1.2rem 2rem rgba(0, 0, 0, .35);
	overflow: hidden;
}
#plate {
	display: flex;
	align-items: center;
	gap: .75rem;
	margin: 0 -1rem 1rem;
	padding: .6rem 1rem;
	background: linear-gradient(#e6e6e3, #b8b8b4);
	border-bottom: 3px solid #0e0e0e;
	color: #222;
}
.brand { font: italic 700 1.35rem Georgia, serif; }
.model { font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; color: #555; }
#lcd {
	margin-left: auto;
	padding: .3rem .5rem;
	background: #9fb08a;
	color: #27331f;
	border-radius: 2px;
	box-shadow: inset 0 1px 3px rgba(0, 0, 0, .45);
	font: .75rem/1 ui-monospace, monospace;
	letter-spacing: .08em;
	white-space: nowrap;
}
#led {
	width: .6rem;
	height: .6rem;
	border-radius: 50%;
	background: #5a1d19;
}
#led.blink { animation: blink .5s steps(1) infinite; background: var(--red); }
@keyframes blink { 50% { background: #5a1d19; } }

#stage {
	position: relative;
	aspect-ratio: 16 / 9;
	background: #000;
	border: .5rem solid #0a0a0a;
	border-radius: .5rem;
	box-shadow: 0 0 0 2px #343434;
	overflow: hidden;
}
video {
	width: 100%;
	height: 100%;
	object-fit: contain;
	display: block;
	transform: scaleX(-1);
}
video.back { transform: none; }
#stage.blink video { visibility: hidden; }
#stage.live::after {
	content: "";
	position: absolute;
	inset: 14%;
	pointer-events: none;
	opacity: .6;
	background:
		linear-gradient(#fff, #fff) top left / 1.2rem 2px no-repeat,
		linear-gradient(#fff, #fff) top left / 2px 1.2rem no-repeat,
		linear-gradient(#fff, #fff) top right / 1.2rem 2px no-repeat,
		linear-gradient(#fff, #fff) top right / 2px 1.2rem no-repeat,
		linear-gradient(#fff, #fff) bottom left / 1.2rem 2px no-repeat,
		linear-gradient(#fff, #fff) bottom left / 2px 1.2rem no-repeat,
		linear-gradient(#fff, #fff) bottom right / 1.2rem 2px no-repeat,
		linear-gradient(#fff, #fff) bottom right / 2px 1.2rem no-repeat;
}
#msg, #count {
	position: absolute;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 1rem;
	text-align: center;
}
#msg { color: #8d8d88; font-style: italic; }
#count {
	color: #fff;
	font-size: 6rem;
	text-shadow: 0 0 12px rgba(0, 0, 0, .6);
	pointer-events: none;
}
#msg:empty, #count:empty { display: none; }

#ctrl {
	display: flex;
	align-items: center;
	gap: .5rem;
	margin-top: 1rem;
}
.key {
	padding: .5rem .75rem;
	background: #2c2c2c;
	color: #cfcfca;
	border: 0;
	border-bottom: 3px solid #0d0d0d;
	border-radius: 4px;
	font-size: .65rem;
	letter-spacing: .1em;
	text-transform: uppercase;
}
.key:active { transform: translateY(2px); border-bottom-width: 1px; }
.key[aria-pressed="true"] { color: #ffd38a; }
#snap {
	margin-left: auto;
	width: 4.2rem;
	height: 4.2rem;
	background: var(--red);
	border: .35rem solid #dcdcd8;
	border-radius: 50%;
	box-shadow: 0 4px 0 #0b0b0b;
}
#snap:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #0b0b0b; }
#snap:disabled { background: #6b3430; cursor: default; }

/* under the camera */
#foot {
	display: flex;
	gap: 1rem;
	justify-content: center;
	margin-top: 1.5rem;
	font-size: .875rem;
}
#foot button, .shot button, .shot a {
	padding: 0;
	background: none;
	border: 0;
	color: var(--dim);
	text-decoration: underline;
}
#note { margin: .25rem 0 0; text-align: center; color: var(--dim); font-size: .875rem; min-height: 1.5em; }

#shots {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
	gap: 1.5rem 1rem;
	max-width: 56rem;
	margin: 2rem auto 0;
}
.shot {
	padding: .5rem .5rem .4rem;
	background: #f4f2ec;
	box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
}
.shot:nth-child(odd) { transform: rotate(-1deg); }
.shot:nth-child(even) { transform: rotate(.8deg); }
.shot img { width: 100%; display: block; }
.shot div { display: flex; justify-content: space-between; margin-top: .4rem; font-size: .75rem; }
.shot a, .shot button { color: #3a3a36; font-size: inherit; cursor: pointer; }

#light {
	position: fixed;
	inset: 0;
	z-index: 10;
	background: #fff;
	opacity: 0;
	pointer-events: none;
	transition: opacity .15s;
}
#light.on { opacity: 1; }
</style>
</head>
<body>
<div id="light"></div>

<div id="cam">
	<div id="plate">
		<span class="brand">klik</span>
		<span class="model">400</span>
		<span id="lcd"></span>
		<span id="led"></span>
	</div>

	<div id="stage">
		<video id="video" autoplay playsinline muted></video>
		<div id="msg">Lens cap is on.</div>
		<div id="count"></div>
	</div>

	<div id="ctrl">
		<button class="key" id="toggle" aria-pressed="false">Power</button>
		<button class="key" id="timer">Timer</button>
		<button class="key" id="flash" aria-pressed="false">Flash</button>
		<button class="key" id="flip" hidden>Flip</button>
		<button id="snap" title="Shutter (space)" aria-label="Shutter" disabled></button>
	</div>
</div>

<div id="foot">
	<button id="theme">desk: auto</button>
	<button id="wipe">toss the roll</button>
</div>
<p id="note"></p>

<div id="shots"></div>

<script>
const video = document.getElementById('video');
const stage = document.getElementById('stage');
const msg = document.getElementById('msg');
const count = document.getElementById('count');
const light = document.getElementById('light');
const lcd = document.getElementById('lcd');
const led = document.getElementById('led');
const note = document.getElementById('note');
const toggle = document.getElementById('toggle');
const timer = document.getElementById('timer');
const flash = document.getElementById('flash');
const flip = document.getElementById('flip');
const snap = document.getElementById('snap');
const theme = document.getElementById('theme');
const wipe = document.getElementById('wipe');
const shots = document.getElementById('shots');

const modes = ['auto', 'light', 'dark'];
const delays = [0, 3, 5, 10];

let stream = null;
let db = null;
let asked = false;
let ids = [];
let step = 0;
let flashOn = false;
let pending = false;
let cancelled = false;
let mode = 'auto';
let audio = null;

function pad(n, w) { return String(n).padStart(w || 2, '0'); }

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function stamp(t) {
	const d = new Date(t);
	return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
		'-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}

function explain(err) {
	if (!navigator.mediaDevices) return 'No lens here. Camera needs https or localhost.';
	switch (err.name) {
	case 'NotAllowedError': return 'Lens is blocked. Allow the camera in the address bar and try again.';
	case 'NotFoundError': return 'No lens found.';
	case 'NotReadableError': return 'Another app is holding the lens.';
	default: return err.message || 'Could not open the lens.';
	}
}

function readout() {
	const t = delays[step] ? delays[step] + 'S' : 'OFF';
	lcd.textContent = pad(shots.children.length, 3) + ' T-' + t + ' FL-' + (flashOn ? 'ON' : 'OFF');
}

function press(el, on) {
	el.setAttribute('aria-pressed', on);
}

/* desk theme */

function applyTheme() {
	const root = document.documentElement;
	if (mode === 'auto') root.removeAttribute('data-theme');
	else root.dataset.theme = mode;
	theme.textContent = 'desk: ' + mode;
}

/* sound */

function click() {
	if (!audio) return;
	const len = Math.floor(audio.sampleRate * 0.05);
	const buf = audio.createBuffer(1, len, audio.sampleRate);
	const d = buf.getChannelData(0);
	for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
	const src = audio.createBufferSource();
	src.buffer = buf;
	src.connect(audio.destination);
	src.start();
}

function shutterSound() {
	click();
	setTimeout(click, 90);
}

/* storage */

function openDb() {
	return new Promise((ok, fail) => {
		if (!window.indexedDB) return fail(new Error('no indexedDB'));
		const req = indexedDB.open('camera', 1);
		req.onupgradeneeded = () => {
			req.result.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
		};
		req.onsuccess = () => ok(req.result);
		req.onerror = () => fail(req.error);
	});
}

function run(mode, fn) {
	return new Promise((ok, fail) => {
		const t = db.transaction('photos', mode);
		const r = fn(t.objectStore('photos'));
		t.oncomplete = () => ok(r.result);
		t.onerror = () => fail(t.error);
		t.onabort = () => fail(t.error);
	});
}

// ask the browser not to evict our data, once, after the first save
function keepStorage() {
	if (asked || !navigator.storage || !navigator.storage.persist) return;
	asked = true;
	navigator.storage.persist();
}

/* camera */

async function listCams() {
	const all = await navigator.mediaDevices.enumerateDevices();
	ids = all.filter(d => d.kind === 'videoinput').map(d => d.deviceId);
	flip.hidden = ids.length < 2;
}

async function start(id) {
	stop();
	const want = id
		? { deviceId: { exact: id } }
		: { width: { ideal: 1920 }, height: { ideal: 1080 } };
	try {
		stream = await navigator.mediaDevices.getUserMedia({ video: want, audio: false });
	} catch (err) {
		msg.textContent = explain(err);
		return;
	}
	video.srcObject = stream;
	const facing = stream.getVideoTracks()[0].getSettings().facingMode;
	video.classList.toggle('back', facing === 'environment');
	msg.textContent = '';
	stage.classList.add('live');
	press(toggle, true);
	snap.disabled = false;
	listCams();
}

function stop() {
	if (!stream) return;
	cancelled = true;
	stream.getTracks().forEach(t => t.stop());
	stream = null;
	video.srcObject = null;
	msg.textContent = 'Lens cap is on.';
	stage.classList.remove('live');
	press(toggle, false);
	snap.disabled = true;
}

/* photos */

function take() {
	if (!stream || !video.videoWidth) return;
	const c = document.createElement('canvas');
	c.width = video.videoWidth;
	c.height = video.videoHeight;
	c.getContext('2d').drawImage(video, 0, 0);

	shutterSound();
	stage.classList.add('blink');
	setTimeout(() => stage.classList.remove('blink'), 90);

	c.toBlob(async blob => {
		const time = Date.now();
		let id = null;
		if (db) {
			try {
				id = await run('readwrite', s => s.add({ blob, time }));
				keepStorage();
			} catch (e) {
				note.textContent = 'That one did not develop. Save it before leaving.';
			}
		}
		add(blob, id, time);
	}, 'image/jpeg', 0.92);
}

// countdown, optional flash, then take(). calling it again mid-countdown cancels.
async function shoot() {
	if (pending) {
		cancelled = true;
		return;
	}
	if (!stream) return;
	pending = true;
	cancelled = false;

	if (!audio && window.AudioContext) {
		try { audio = new AudioContext(); } catch (e) {}
	}

	const secs = delays[step];
	if (secs) led.classList.add('blink');
	for (let n = secs; n > 0 && !cancelled; n--) {
		count.textContent = n;
		await wait(1000);
	}
	count.textContent = '';
	led.classList.remove('blink');

	if (!cancelled && flashOn) {
		light.classList.add('on');
		await wait(450);
	}
	if (!cancelled) take();

	light.classList.remove('on');
	pending = false;
}

function add(blob, id, time) {
	const url = URL.createObjectURL(blob);
	const box = document.createElement('div');
	box.className = 'shot';

	const img = document.createElement('img');
	img.src = url;
	img.alt = 'photo';

	const row = document.createElement('div');
	const dl = document.createElement('a');
	dl.href = url;
	dl.download = 'photo-' + stamp(time) + '.jpg';
	dl.textContent = 'save';
	const rm = document.createElement('button');
	rm.textContent = 'toss';
	rm.onclick = async () => {
		if (id !== null && db) {
			try {
				await run('readwrite', s => s.delete(id));
			} catch (e) {
				note.textContent = 'Could not toss that one.';
				return;
			}
		}
		URL.revokeObjectURL(url);
		box.remove();
		readout();
	};

	row.append(dl, rm);
	box.append(img, row);
	shots.prepend(box);
	readout();
}

async function wipeAll() {
	if (!shots.children.length || !confirm('Toss the whole roll?')) return;
	if (db) {
		try {
			await run('readwrite', s => s.clear());
		} catch (e) {
			note.textContent = 'Could not clear the roll.';
			return;
		}
	}
	shots.querySelectorAll('img').forEach(i => URL.revokeObjectURL(i.src));
	shots.innerHTML = '';
	readout();
}

toggle.onclick = () => (stream ? stop() : start());
snap.onclick = shoot;
wipe.onclick = wipeAll;
addEventListener('pagehide', stop);

timer.onclick = () => {
	step = (step + 1) % delays.length;
	readout();
};

flash.onclick = () => {
	flashOn = !flashOn;
	press(flash, flashOn);
	readout();
};

flip.onclick = () => {
	const cur = stream && stream.getVideoTracks()[0].getSettings().deviceId;
	const next = (ids.indexOf(cur) + 1) % ids.length;
	start(ids[next]);
};

theme.onclick = () => {
	mode = modes[(modes.indexOf(mode) + 1) % modes.length];
	try { localStorage.setItem('theme', mode); } catch (e) {}
	applyTheme();
};

document.addEventListener('keydown', e => {
	if (e.code === 'Space' && e.target === document.body) {
		e.preventDefault();
		shoot();
	}
});

try {
	const saved = localStorage.getItem('theme');
	if (modes.includes(saved)) mode = saved;
} catch (e) {}
applyTheme();
readout();

(async () => {
	try {
		db = await openDb();
		const saved = await run('readonly', s => s.getAll());
		saved.forEach(p => add(p.blob, p.id, p.time));
		note.textContent = 'The film stays in this browser. Nothing is uploaded.';
	} catch (e) {
		db = null;
		note.textContent = 'No film in this camera (storage blocked, private window?). Shots last until you close the tab.';
	}
})();
</script>
</body>
</html>
