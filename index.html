<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>klik</title>
<style>
:root {
	--bg: #ebe2cc;
	--hi: #f7f1e1;
	--fg: #2a2722;
	--dim: #7a7160;
	--line: #c5b99d;
	--red: #cc3a2b;
}
:root[data-theme="dark"] {
	--bg: #221e18;
	--hi: #2d2820;
	--fg: #eae2cf;
	--dim: #a39a85;
	--line: #4a4437;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #221e18;
		--hi: #2d2820;
		--fg: #eae2cf;
		--dim: #a39a85;
		--line: #4a4437;
	}
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
	margin: 0;
	background: radial-gradient(120% 80% at 50% 0%, var(--hi), var(--bg)) fixed, var(--bg);
	color: var(--fg);
	font: 16px/1.5 system-ui, sans-serif;
}
#grain {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	z-index: 9;
	pointer-events: none;
	mix-blend-mode: multiply;
}
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, img:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* first screen: just the camera */
#top {
	min-height: 100vh;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	padding: 1rem 1rem 2rem;
}
#cam {
	width: max(18rem, min(100%, 80rem, calc((100vh - 14.5rem) * 1.7778 + 1.6rem)));
	font-family: Georgia, 'Iowan Old Style', serif;
}
#frame {
	position: relative;
	padding: .8rem;
	background: #faf6ea;
	box-shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 .5rem 1.2rem rgba(0, 0, 0, .18);
}
#frame::before, #frame::after {
	content: "";
	position: absolute;
	top: -.7rem;
	width: 5rem;
	height: 1.4rem;
	background: rgba(226, 204, 132, .78);
	box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
}
#frame::before { left: 1.5rem; transform: rotate(-4deg); }
#frame::after { right: 1.5rem; transform: rotate(3deg); }

#stage {
	position: relative;
	aspect-ratio: 16 / 9;
	background: #000;
	overflow: hidden;
}
video {
	width: 100%;
	height: 100%;
	object-fit: contain;
	display: block;
	transform: scaleX(-1);
}
video.back { transform: none; }
#stage.blink video { visibility: hidden; }
#msg, #count {
	position: absolute;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 1rem;
	text-align: center;
}
#msg { color: #8d8d88; pointer-events: none; }
#count {
	color: #fff;
	font-size: clamp(5rem, 14vh, 9rem);
	text-shadow: 0 0 12px rgba(0, 0, 0, .6);
	pointer-events: none;
}
#msg:empty, #count:empty { display: none; }
#tag {
	position: absolute;
	bottom: .6rem;
	left: .8rem;
	color: #fff;
	font-size: .8rem;
	text-shadow: 0 0 6px rgba(0, 0, 0, .7);
	pointer-events: none;
}

/* options sit on top of the video */
#opts {
	position: absolute;
	top: .6rem;
	left: .6rem;
	z-index: 2;
	display: flex;
	gap: .4rem;
}
.opt {
	padding: .2rem .6rem;
	background: #f6f0e0;
	color: #2a2722;
	border: 1px solid #cdbf9f;
	border-radius: 2px;
	box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
	font: italic .8rem Georgia, 'Iowan Old Style', serif;
}
.opt:hover { background: #fff; }
.opt[hidden] { display: none; }

/* shutter in the middle, start button at its corner */
#ctrl {
	display: grid;
	grid-template-columns: 1fr auto 1fr;
	align-items: end;
	margin-top: 1rem;
}
#snap { grid-column: 2; }
#toggle { height: 18px; width: 18px; border-radius: 100%; background: #62271e; border: 0 ; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .1), 0 0 0 3.2px var(--bg), 0 0 0 4.7px ##6d675c ; padding: 1px; grid-column: 3; justify-self: start; margin-left: .5rem; }
.key {
	padding: .35rem .8rem;
	background: transparent;
	color: var(--fg);
	border: 1px solid var(--fg);
	border-radius: 2px;
	font: italic .95rem Georgia, 'Iowan Old Style', serif;
}
a.key { display: inline-block; text-decoration: none; }
.key:hover, .key[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
#snap {
	width: 4rem;
	height: 4rem;
	margin: 0 5px;
	background: var(--red);
	border: 0;
	border-radius: 50%;
	box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .3), 0 0 0 3px var(--bg), 0 0 0 5px var(--fg);
}
#snap:active:not(:disabled) { transform: scale(.95); }
#snap:disabled { opacity: .4; cursor: default; }

#slot {
	height: 0;
	margin-top: 1.25rem;
	border-top: 2px dashed var(--fg);
	opacity: .55;
}

#more {
	margin-top: 1.25rem;
	color: var(--dim);
	font: italic .95rem Georgia, 'Iowan Old Style', serif;
	text-decoration: none;
}
#more:hover { color: var(--fg); }

/* the print that drops into the slot */
#drop {
	position: fixed;
	left: 0;
	right: 0;
	top: 0;
	height: 0;
	overflow: hidden;
	pointer-events: none;
	z-index: 5;
}
.print {
	position: absolute;
	padding: .7rem .7rem 0;
	background: #f4f2ec;
	box-shadow: 0 .8rem 2.4rem rgba(0, 0, 0, .55);
	transform-origin: 50% 0;
}
.print img { width: 100%; display: block; }
.print span {
	display: block;
	padding: .7rem 0 .8rem;
	color: #444;
	font: italic 1rem Georgia, serif;
}

/* the roll, below the fold */
#roll {
	max-width: 72rem;
	margin: 0 auto;
	padding: 3rem 1rem 5rem;
}
.head {
	display: flex;
	justify-content: space-between;
	align-items: baseline;
	font-size: .875rem;
}
.head h2 { margin: 0; font: italic 700 1.4rem Georgia, serif; }
.head div { display: flex; gap: 1rem; }
.head button, .shot button, .shot a {
	padding: 0;
	background: none;
	border: 0;
	color: var(--dim);
	text-decoration: underline;
}
.head button[hidden] { display: none; }
#make { color: var(--red); }
#note { margin: .25rem 0 1.5rem; color: var(--dim); font-size: .875rem; min-height: 1.5em; }

#shots {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
	gap: 1.75rem 1.25rem;
}
.shot {
	position: relative;
	padding: .5rem .5rem .4rem;
	background: #f4f2ec;
	box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
}
.shot:nth-child(odd) { transform: rotate(-1deg); }
.shot:nth-child(even) { transform: rotate(.8deg); }
.shot img { width: 100%; display: block; cursor: pointer; }
.shot div { display: flex; justify-content: space-between; margin-top: .4rem; font-size: .75rem; }
.shot a, .shot button { color: #3a3a36; font-size: inherit; cursor: pointer; }
.shot.picked { outline: 3px solid var(--red); outline-offset: 3px; }
.shot.picked::after {
	content: "\2713";
	position: absolute;
	top: -.7rem;
	right: -.7rem;
	width: 1.5rem;
	height: 1.5rem;
	background: var(--red);
	border-radius: 50%;
	color: #fff;
	font-size: .9rem;
	line-height: 1.5rem;
	text-align: center;
}

/* collage */
#lab {
	max-width: 96vw;
	max-height: 96vh;
	padding: 0;
	border: 1px solid var(--line);
	border-radius: 6px;
	background: var(--bg);
	color: var(--fg);
}
#lab::backdrop { background: rgba(0, 0, 0, .6); }
.lab-in {
	display: flex;
	gap: 1.5rem;
	padding: 1.25rem;
}
.lab-in canvas {
	display: block;
	align-self: center;
	max-width: 56vw;
	max-height: 80vh;
	box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
}
.lab-side { display: flex; flex-direction: column; gap: 1rem; min-width: 10rem; }
.lab-side h3 { margin: 0; font: italic 700 1.3rem Georgia, serif; }
.lab-side .row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
.lab-side .end { margin-top: auto; }
.swatch {
	width: 1.8rem;
	height: 1.8rem;
	border: 1px solid var(--line);
	border-radius: 50%;
}
.swatch[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 2px; }
@media (max-width: 40rem) {
	.lab-in { flex-direction: column; }
	.lab-in canvas { max-width: 100%; max-height: 50vh; }
}

#light {
	position: fixed;
	inset: 0;
	z-index: 10;
	background: #fff;
	opacity: 0;
	pointer-events: none;
	transition: opacity .15s;
}
#light.on { opacity: 1; }
</style>
</head>
<body>
<div id="light"></div>
<div id="drop"></div>
<svg id="grain" aria-hidden="true">
	<filter id="paper">
		<feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
		<feColorMatrix values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .18  0 0 0 .22 0"/>
	</filter>
	<rect width="100%" height="100%" filter="url(#paper)"/>
</svg>

<section id="top">
	<div id="cam">
		<div id="frame">
		<div id="stage">
			<video id="video" autoplay playsinline muted></video>
			<div id="msg">Camera is off.</div>
			<div id="count"></div>
			<div id="tag"></div>
			<div id="opts">
				<button class="opt" id="poses"></button>
				<button class="opt" id="timer"></button>
				<button class="opt" id="flash"></button>
				<button class="opt" id="flip" hidden>flip</button>
			</div>
		</div>
		</div>

		<div id="ctrl">
			<button id="snap" title="Shutter (space)" aria-label="Shutter" disabled></button>
			<button class="key" id="toggle"></button>
		</div>

		<div id="slot"></div>
	</div>
	<a id="more" href="#roll">the roll &darr;</a>
</section>

<section id="roll">
	<div class="head">
		<h2>the roll</h2>
		<div>
			<button id="make" hidden>collage (0)</button>
			<button id="theme">desk: auto</button>
			<button id="wipe">toss the roll</button>
		</div>
	</div>
	<p id="note"></p>
	<div id="shots"></div>
</section>

<dialog id="lab">
	<div class="lab-in">
		<canvas id="sheet"></canvas>
		<div class="lab-side">
			<h3>your collage</h3>
			<div class="row">
				<button class="key" data-layout="strip">strip</button>
				<button class="key" data-layout="grid">grid</button>
			</div>
			<div class="row" id="swatches"></div>
			<div class="row">
				<button class="key" id="bw" aria-pressed="false">b&amp;w</button>
			</div>
			<div class="row end">
				<a class="key" id="get">save</a>
				<button class="key" id="shut">close</button>
			</div>
		</div>
	</div>
</dialog>

<script>
const video = document.getElementById('video');
const stage = document.getElementById('stage');
const msg = document.getElementById('msg');
const count = document.getElementById('count');
const tag = document.getElementById('tag');
const light = document.getElementById('light');
const drop = document.getElementById('drop');
const slot = document.getElementById('slot');
const note = document.getElementById('note');
const toggle = document.getElementById('toggle');
const posesKey = document.getElementById('poses');
const timer = document.getElementById('timer');
const flash = document.getElementById('flash');
const flip = document.getElementById('flip');
const snap = document.getElementById('snap');
const make = document.getElementById('make');
const theme = document.getElementById('theme');
const wipe = document.getElementById('wipe');
const shots = document.getElementById('shots');
const lab = document.getElementById('lab');
const sheet = document.getElementById('sheet');
const swatches = document.getElementById('swatches');
const bwKey = document.getElementById('bw');
const get = document.getElementById('get');

const modes = ['auto', 'light', 'dark'];
const delays = [0, 3, 5, 10];
const frames = {
	cream: { bg: '#f4f2ec', fg: '#3a3a36' },
	black: { bg: '#151515', fg: '#d8d6d0' },
	red: { bg: '#b8342b', fg: '#f6e8de' },
	blue: { bg: '#1f3a5f', fg: '#e6ecf4' }
};

let stream = null;
let db = null;
let asked = false;
let ids = [];
let step = 0;
let poses = 1;
let flashOn = false;
let pending = false;
let cancelled = false;
let mode = 'auto';
let audio = null;
let sayTimer = 0;
let bmps = [];
let sheetUrl = '';
let look = { layout: 'strip', frame: 'cream', bw: false };
const picked = new Set();

function pad(n) { return String(n).padStart(2, '0'); }

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function stamp(t) {
	const d = new Date(t);
	return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
		'-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}

function explain(err) {
	if (!navigator.mediaDevices) return 'Camera needs https or localhost.';
	switch (err.name) {
	case 'NotAllowedError': return 'Camera access was blocked. Allow it in the address bar and try again.';
	case 'NotFoundError': return 'No camera found.';
	case 'NotReadableError': return 'Camera is in use by another app.';
	default: return err.message || 'Could not open the camera.';
	}
}

function labels() {
	posesKey.textContent = poses === 1 ? '1 pose' : '4 poses';
	timer.textContent = delays[step] ? 'timer ' + delays[step] + 's' : 'timer off';
	flash.textContent = 'flash ' + (flashOn ? 'on' : 'off');
}

function press(el, on) {
	el.setAttribute('aria-pressed', on);
}

// short message over the video, since the roll is off screen
function say(text) {
	msg.textContent = text;
	clearTimeout(sayTimer);
	sayTimer = setTimeout(() => {
		msg.textContent = stream ? '' : 'Camera is off.';
	}, 3500);
}

/* desk theme */

function applyTheme() {
	const root = document.documentElement;
	if (mode === 'auto') root.removeAttribute('data-theme');
	else root.dataset.theme = mode;
	theme.textContent = 'desk: ' + mode;
}

/* sound */

function click() {
	if (!audio) return;
	const len = Math.floor(audio.sampleRate * 0.05);
	const buf = audio.createBuffer(1, len, audio.sampleRate);
	const d = buf.getChannelData(0);
	for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
	const src = audio.createBufferSource();
	src.buffer = buf;
	src.connect(audio.destination);
	src.start();
}

function shutterSound() {
	click();
	setTimeout(click, 90);
}

/* storage */

function openDb() {
	return new Promise((ok, fail) => {
		if (!window.indexedDB) return fail(new Error('no indexedDB'));
		const req = indexedDB.open('camera', 1);
		req.onupgradeneeded = () => {
			req.result.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
		};
		req.onsuccess = () => ok(req.result);
		req.onerror = () => fail(req.error);
	});
}

function run(mode, fn) {
	return new Promise((ok, fail) => {
		const t = db.transaction('photos', mode);
		const r = fn(t.objectStore('photos'));
		t.oncomplete = () => ok(r.result);
		t.onerror = () => fail(t.error);
		t.onabort = () => fail(t.error);
	});
}

// ask the browser not to evict our data, once, after the first save
function keepStorage() {
	if (asked || !navigator.storage || !navigator.storage.persist) return;
	asked = true;
	navigator.storage.persist();
}

/* camera */

async function listCams() {
	const all = await navigator.mediaDevices.enumerateDevices();
	ids = all.filter(d => d.kind === 'videoinput').map(d => d.deviceId);
	flip.hidden = ids.length < 2;
}

async function start(id) {
	stop();
	const want = id
		? { deviceId: { exact: id } }
		: { width: { ideal: 1920 }, height: { ideal: 1080 } };
	try {
		stream = await navigator.mediaDevices.getUserMedia({ video: want, audio: false });
	} catch (err) {
		msg.textContent = explain(err);
		return;
	}
	video.srcObject = stream;
	const facing = stream.getVideoTracks()[0].getSettings().facingMode;
	video.classList.toggle('back', facing === 'environment');
	msg.textContent = '';
	toggle.textContent = '';
	snap.disabled = false;
	listCams();
}

function stop() {
	if (!stream) return;
	cancelled = true;
	stream.getTracks().forEach(t => t.stop());
	stream = null;
	video.srcObject = null;
	msg.textContent = 'Camera is off.';
	toggle.textContent = '';
	snap.disabled = true;
}

/* photos */

// show the fresh print big over the video, then drop it into the slot
async function eject(blob, time) {
	const sr = stage.getBoundingClientRect();
	const slotBox = slot.getBoundingClientRect();
	const offscreen = sr.bottom < 0 || sr.top > innerHeight;
	if (offscreen || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

	const cut = slotBox.top + slotBox.height / 2;
	drop.style.height = cut + 'px';

	const url = URL.createObjectURL(blob);
	const p = document.createElement('div');
	p.className = 'print';
	const img = document.createElement('img');
	img.src = url;
	img.alt = '';
	const cap = document.createElement('span');
	cap.textContent = new Date(time).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
	p.append(img, cap);

	const w = Math.min(sr.width * 0.62, 720);
	p.style.width = w + 'px';
	p.style.left = sr.left + (sr.width - w) / 2 + 'px';
	try { await img.decode(); } catch (e) {}
	drop.append(p);

	const top = Math.max(8, sr.top + (sr.height - p.offsetHeight) / 2);
	p.style.top = top + 'px';
	const fall = cut - top + 4;

	try {
		await p.animate([
			{ opacity: 0, transform: 'translateY(-14px) rotate(-3deg) scale(.92)' },
			{ opacity: 1, transform: 'translateY(0px) rotate(-1.5deg) scale(1)' }
		], { duration: 220, easing: 'ease-out', fill: 'forwards' }).finished;
		await wait(1100);
		await p.animate([
			{ transform: 'translateY(0px) rotate(-1.5deg) scale(1)' },
			{ transform: 'translateY(' + fall + 'px) rotate(0deg) scale(.4)' }
		], { duration: 650, easing: 'ease-in', fill: 'forwards' }).finished;
	} finally {
		p.remove();
		URL.revokeObjectURL(url);
	}
}

// one frame: grab it, save it, hand back the record
function capture() {
	return new Promise(resolve => {
		if (!stream || !video.videoWidth) return resolve(null);
		const c = document.createElement('canvas');
		c.width = video.videoWidth;
		c.height = video.videoHeight;
		c.getContext('2d').drawImage(video, 0, 0);

		shutterSound();
		stage.classList.add('blink');
		setTimeout(() => stage.classList.remove('blink'), 90);

		c.toBlob(async blob => {
			const time = Date.now();
			let id = null;
			if (db) {
				try {
					id = await run('readwrite', s => s.add({ blob, time }));
					keepStorage();
				} catch (e) {
					say('Could not save that photo. Download it before leaving.');
				}
			}
			resolve({ blob, id, time });
		}, 'image/jpeg', 0.92);
	});
}

// countdown, optional flash, then a frame. with 4 poses it repeats and
// opens the collage at the end. pressing the shutter again cancels.
async function shoot() {
	if (pending) {
		cancelled = true;
		return;
	}
	if (!stream) return;
	pending = true;
	cancelled = false;

	if (!audio && window.AudioContext) {
		try { audio = new AudioContext(); } catch (e) {}
	}

	const total = poses;
	const taken = [];
	const boxes = [];
	for (let i = 0; i < total && !cancelled; i++) {
		if (total > 1) tag.textContent = 'pose ' + (i + 1) + '/' + total;

		const secs = total > 1 ? Math.max(delays[step], 3) : delays[step];
		for (let n = secs; n > 0 && !cancelled; n--) {
			count.textContent = n;
			await wait(1000);
		}
		count.textContent = '';
		if (cancelled) break;

		if (flashOn) {
			light.classList.add('on');
			await wait(450);
		}
		const rec = cancelled ? null : await capture();
		light.classList.remove('on');
		if (!rec) break;
		taken.push(rec);

		if (total === 1) {
			eject(rec.blob, rec.time).catch(() => {}).then(() => add(rec.blob, rec.id, rec.time));
		} else {
			boxes.push(add(rec.blob, rec.id, rec.time));
			await wait(500);
		}
	}

	tag.textContent = '';
	pending = false;

	if (total > 1 && taken.length > 1 && !cancelled) {
		pick(boxes);
		await wait(400);
		openLab(taken.map(r => r.blob));
	}
}

function add(blob, id, time) {
	const url = URL.createObjectURL(blob);
	const box = document.createElement('div');
	box.className = 'shot';
	box.rec = { blob, time };

	const img = document.createElement('img');
	img.src = url;
	img.alt = 'photo';
	img.title = 'Pick for a collage';
	img.tabIndex = 0;
	img.onclick = () => {
		if (picked.has(box)) {
			picked.delete(box);
			box.classList.remove('picked');
		} else if (picked.size >= 8) {
			note.textContent = 'A collage holds up to 8 prints.';
			return;
		} else {
			picked.add(box);
			box.classList.add('picked');
		}
		syncPicks();
	};
	img.onkeydown = e => {
		if (e.key === 'Enter') img.click();
	};

	const row = document.createElement('div');
	const dl = document.createElement('a');
	dl.href = url;
	dl.download = 'photo-' + stamp(time) + '.jpg';
	dl.textContent = 'save';
	const rm = document.createElement('button');
	rm.textContent = 'toss';
	rm.onclick = async () => {
		if (id !== null && db) {
			try {
				await run('readwrite', s => s.delete(id));
			} catch (e) {
				note.textContent = 'Could not toss that one.';
				return;
			}
		}
		URL.revokeObjectURL(url);
		picked.delete(box);
		box.remove();
		syncPicks();
	};

	row.append(dl, rm);
	box.append(img, row);
	shots.prepend(box);
	return box;
}

async function wipeAll() {
	if (!shots.children.length || !confirm('Toss the whole roll?')) return;
	if (db) {
		try {
			await run('readwrite', s => s.clear());
		} catch (e) {
			note.textContent = 'Could not clear the roll.';
			return;
		}
	}
	shots.querySelectorAll('img').forEach(i => URL.revokeObjectURL(i.src));
	shots.innerHTML = '';
	picked.clear();
	syncPicks();
}

/* picking prints */

function syncPicks() {
	make.hidden = picked.size < 2;
	make.textContent = 'collage (' + picked.size + ')';
}

function pick(boxes) {
	picked.forEach(b => b.classList.remove('picked'));
	picked.clear();
	boxes.forEach(b => {
		picked.add(b);
		b.classList.add('picked');
	});
	syncPicks();
}

/* collage */

function drawSheet() {
	const n = bmps.length;
	const f = frames[look.frame];
	const strip = look.layout === 'strip';
	const cols = strip ? 1 : (n <= 3 ? n : n === 4 ? 2 : 3);
	const rows = Math.ceil(n / cols);
	const edge = 40, gap = 24, foot = 120;
	const cw = strip ? 540 : 420;
	const ch = cw * 3 / 4;

	const w = edge * 2 + cols * cw + (cols - 1) * gap;
	const bottom = edge + rows * ch + (rows - 1) * gap;
	sheet.width = w;
	sheet.height = bottom + foot + edge;

	const g = sheet.getContext('2d');
	g.fillStyle = f.bg;
	g.fillRect(0, 0, w, sheet.height);

	g.filter = look.bw ? 'grayscale(1) contrast(1.1)' : 'none';
	bmps.forEach((b, i) => {
		const r = Math.floor(i / cols);
		const inRow = Math.min(cols, n - r * cols);
		const x = edge + (i % cols) * (cw + gap) + (cols - inRow) * (cw + gap) / 2;
		const y = edge + r * (ch + gap);

		// crop to 4:3 from the middle
		let sw = b.width, sh = b.height, sx = 0, sy = 0;
		if (b.width / b.height > cw / ch) {
			sw = b.height * cw / ch;
			sx = (b.width - sw) / 2;
		} else {
			sh = b.width * ch / cw;
			sy = (b.height - sh) / 2;
		}
		g.drawImage(b, sx, sy, sw, sh, x, y, cw, ch);
	});
	g.filter = 'none';

	g.fillStyle = f.fg;
	g.textAlign = 'center';
	g.font = 'italic 700 42px Georgia, serif';
	g.fillText('klik photo booth', w / 2, bottom + 70);
	g.font = '22px system-ui, sans-serif';
	g.fillText(new Date().toLocaleDateString([], { dateStyle: 'long' }), w / 2, bottom + 106);
}

function paint() {
	document.querySelectorAll('[data-layout]').forEach(b => press(b, b.dataset.layout === look.layout));
	swatches.querySelectorAll('button').forEach(b => press(b, b.dataset.frame === look.frame));
	press(bwKey, look.bw);
	drawSheet();

	get.download = (look.layout === 'strip' ? 'strip-' : 'collage-') + stamp(Date.now()) + '.jpg';
	sheet.toBlob(b => {
		if (sheetUrl) URL.revokeObjectURL(sheetUrl);
		sheetUrl = URL.createObjectURL(b);
		get.href = sheetUrl;
	}, 'image/jpeg', 0.92);
}

async function openLab(blobs) {
	bmps.forEach(b => b.close());
	bmps = await Promise.all(blobs.map(b => createImageBitmap(b)));
	paint();
	if (!lab.open) lab.showModal();
}

lab.onclose = () => {
	bmps.forEach(b => b.close());
	bmps = [];
	if (sheetUrl) URL.revokeObjectURL(sheetUrl);
	sheetUrl = '';
};
lab.onclick = e => {
	if (e.target === lab) lab.close();
};
document.getElementById('shut').onclick = () => lab.close();

document.querySelectorAll('[data-layout]').forEach(b => {
	b.onclick = () => {
		look.layout = b.dataset.layout;
		paint();
	};
});

Object.keys(frames).forEach(k => {
	const b = document.createElement('button');
	b.className = 'swatch';
	b.dataset.frame = k;
	b.title = k;
	b.setAttribute('aria-label', k + ' frame');
	b.style.background = frames[k].bg;
	b.onclick = () => {
		look.frame = k;
		paint();
	};
	swatches.append(b);
});

if (!('filter' in CanvasRenderingContext2D.prototype)) bwKey.hidden = true;
bwKey.onclick = () => {
	look.bw = !look.bw;
	paint();
};

make.onclick = () => {
	const list = [...picked].sort((a, b) => a.rec.time - b.rec.time);
	openLab(list.map(b => b.rec.blob));
};

/* wiring */

toggle.onclick = () => (stream ? stop() : start());
snap.onclick = shoot;
wipe.onclick = wipeAll;
addEventListener('pagehide', stop);

posesKey.onclick = () => {
	poses = poses === 1 ? 4 : 1;
	labels();
};

timer.onclick = () => {
	step = (step + 1) % delays.length;
	labels();
};

flash.onclick = () => {
	flashOn = !flashOn;
	labels();
};

flip.onclick = () => {
	const cur = stream && stream.getVideoTracks()[0].getSettings().deviceId;
	const next = (ids.indexOf(cur) + 1) % ids.length;
	start(ids[next]);
};

theme.onclick = () => {
	mode = modes[(modes.indexOf(mode) + 1) % modes.length];
	try { localStorage.setItem('theme', mode); } catch (e) {}
	applyTheme();
};

document.addEventListener('keydown', e => {
	if (e.code === 'Space' && e.target === document.body) {
		e.preventDefault();
		shoot();
	}
});

try {
	const saved = localStorage.getItem('theme');
	if (modes.includes(saved)) mode = saved;
} catch (e) {}
applyTheme();
labels();

(async () => {
	try {
		db = await openDb();
		const saved = await run('readonly', s => s.getAll());
		saved.forEach(p => add(p.blob, p.id, p.time));
		note.textContent = 'The film stays in this browser. Nothing is uploaded. Tap prints to pick them for a collage.';
	} catch (e) {
		db = null;
		note.textContent = 'No film in this booth (storage blocked, private window?). Shots last until you close the tab.';
	}
})();
</script>
</body>
